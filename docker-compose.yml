services:
  postgres:
    image: postgres:16-alpine
    container_name: helpdesk-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: helpdesk
    volumes:
      - helpdesk-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    container_name: helpdesk-db-test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: helpdesk_test
    tmpfs:
      - /var/lib/postgresql/data

  api:
    build: .
    container_name: helpdesk-api
    ports:
      - "3333:3333"
    environment:
      PORT: 3333
      DATABASE_URL: "postgresql://docker:docker@postgres:5432/helpdesk?schema=public"
      JWT_SECRET: "${JWT_SECRET}"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  helpdesk-data: